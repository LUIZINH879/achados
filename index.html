<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achados que Valem 014 | Ofertas do Mercado Livre</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #122620; color: #122620; min-height: 100vh; padding: 16px; }
    .wrap { max-width: 760px; margin: 0 auto; background: #FAF7F2; border-radius: 24px; padding: 20px 16px 28px; }
    header { text-align: center; margin-bottom: 18px; }
    .badge { display: inline-block; background: #E85D04; color: #fff; font-weight: 800; font-size: 13px; padding: 6px 16px; border-radius: 99px; letter-spacing: .5px; }
    h1 { font-size: 22px; margin: 10px 0 4px; color: #122620; }
    .sub { font-size: 14px; color: #5C6B63; margin-bottom: 14px; }
    .busca { width: 100%; padding: 12px 16px; border-radius: 14px; border: 2px solid #DDD6C7; font-size: 15px; outline: none; background: #fff; }
    .busca:focus { border-color: #E85D04; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
    .card { background: #fff; border: 1.5px solid #DDD6C7; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .15s; }
    .card:active { transform: scale(.98); }
    .foto-box { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 8px; }
    .foto-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .titulo { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
    .preco { font-size: 17px; font-weight: 800; color: #1B4332; margin: 8px 0; }
    .btn { margin-top: auto; background: #E85D04; color: #fff; text-align: center; font-weight: 700; font-size: 12px; padding: 9px 6px; border-radius: 10px; }
    .vazio { text-align: center; padding: 36px 12px; color: #5C6B63; font-size: 15px; }
    footer { text-align: center; margin-top: 22px; font-size: 13px; color: #5C6B63; }
    footer a { color: #122620; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">ACHADINHO QUE VALE</span>
      <h1>@Achados_que_valem014</h1>
      <p class="sub">Clique no produto para abrir a oferta no Mercado Livre</p>
      <input id="busca" class="busca" type="search" placeholder="🔎 Procurar um achadinho...">
    </header>
    <main id="lista" class="grid"></main>
    <p id="vazio" class="vazio" style="display:none;">Nenhum achadinho encontrado.</p>
    <footer>
      Siga no <a href="https://instagram.com/Achados_que_valem014" target="_blank">Instagram</a> e no
      <a href="https://pinterest.com/achadosquevalem014" target="_blank">Pinterest</a>
    </footer>
  </div>
  <script>
    let itens = [];
    const listaEl = document.getElementById('lista');
    const vazioEl = document.getElementById('vazio');

    function desenhar(filtro = '') {
      const f = filtro.toLowerCase().trim();
      const filtrados = itens.filter(p => (p.titulo || '').toLowerCase().includes(f));
      vazioEl.style.display = filtrados.length ? 'none' : 'block';
      listaEl.innerHTML = filtrados.map(p => `
        <a class="card" href="${p.url}" target="_blank" rel="noopener">
          <div class="foto-box">
            <img src="${p.img}" alt="" loading="lazy" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}" data-fb="${p.img_fallback || ''}">
          </div>
          <div class="titulo">${p.titulo}</div>
          <div class="preco">${p.preco}</div>
          <div class="btn">VER NO MERCADO LIVRE</div>
        </a>
      `).join('');
    }

    fetch('produtos.json?v=' + Date.now())
      .then(r => r.json())
      .then(dados => { itens = Array.isArray(dados) ? dados : []; desenhar(); })
      .catch(() => { vazioEl.style.display = 'block'; });

    document.getElementById('busca').addEventListener('input', e => desenhar(e.target.value));
  </script>
</body>
</html>
